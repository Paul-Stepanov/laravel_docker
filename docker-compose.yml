services:
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./src:/var/www
      - ./docker/nginx/:/etc/nginx/templates/
      - ./logs/nginx:/var/log/nginx
    environment:
      - DOMAIN
      - DOMAIN_PROD
    depends_on:
      - php

  php:
    build:
      args:
        user: laravel
        uid: 1000
        NODE_VERSION: ${NODE_VERSION}
      context: .
      dockerfile: docker/php/Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./src:/var/www
      - ./.env:/var/www/.env
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/.user.ini
      - ./logs/php:/var/log/php
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PHP_IDE_CONFIG: "serverName=${PHP_IDE_CONFIG_SERVER_NAME}" # PHP_IDE_CONFIG_SERVER_NAME - так-же должен называться сервер xDebug в настройках PhpStorm
    depends_on:
      - update
      - db

  # update - скрипт, который подготавливает приложение к работе и синхронизирует composer зависимости
  update:
    build:
      args:
        user: laravel
        uid: 1000
        NODE_VERSION: ${NODE_VERSION}
      context: .
      dockerfile: docker/php/Dockerfile
    command: sh -c "chmod +x ./update.sh && ./update.sh"
    restart: no
    volumes:
      - ./src:/var/www
      - ./.env:/var/www/.env
      - ./docker/php/update.sh:/var/www/update.sh
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:10.9
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/config/postgresql/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
